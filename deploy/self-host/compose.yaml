name: beebuzz

services:
  server:
    image: codeberg.org/beebuzz/beebuzz-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BEEBUZZ_ENV: production
      BEEBUZZ_DEPLOYMENT_MODE: self_hosted
      BEEBUZZ_DOMAIN: ${BEEBUZZ_DOMAIN:?Set BEEBUZZ_DOMAIN in .env}
      BEEBUZZ_PROXY_SUBNET: 172.30.0.0/24
      BEEBUZZ_DB_DIR: /var/lib/beebuzz/db
      BEEBUZZ_ATTACHMENTS_DIR: /var/lib/beebuzz/attachments
    volumes:
      - database:/var/lib/beebuzz/db
      - attachments:/var/lib/beebuzz/attachments
    networks:
      - beebuzz

  web:
    image: codeberg.org/beebuzz/beebuzz-web:latest
    restart: unless-stopped
    environment:
      BEEBUZZ_DOMAIN: ${BEEBUZZ_DOMAIN:?Set BEEBUZZ_DOMAIN in .env}
    networks:
      - beebuzz

  gateway:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - server
      - web
    environment:
      BEEBUZZ_DOMAIN: ${BEEBUZZ_DOMAIN:?Set BEEBUZZ_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${BEEBUZZ_CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: ${BEEBUZZ_CADDY_CONFIG:-caddy_auto}
        target: /etc/caddy/Caddyfile
    networks:
      - beebuzz

  mailpit:
    image: axllent/mailpit:latest
    profiles: [local]
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH: dev:dev
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - beebuzz

networks:
  beebuzz:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  database:
  attachments:
  caddy_data:
  caddy_config:

configs:
  caddy_auto:
    content: |
      dashboard.${BEEBUZZ_DOMAIN} {
        reverse_proxy web:80
      }

      hive.${BEEBUZZ_DOMAIN} {
        reverse_proxy web:80
      }

      api.${BEEBUZZ_DOMAIN} {
        reverse_proxy server:8899
      }
  caddy_lancert:
    content: |
      (lancert_tls) {
        tls /certs/fullchain.pem /certs/privkey.pem
      }

      dashboard.${BEEBUZZ_DOMAIN} {
        import lancert_tls
        reverse_proxy web:80
      }

      hive.${BEEBUZZ_DOMAIN} {
        import lancert_tls
        reverse_proxy web:80
      }

      api.${BEEBUZZ_DOMAIN} {
        import lancert_tls
        reverse_proxy server:8899
      }
